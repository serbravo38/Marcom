server {
    listen 80;
    server_name marcomchile.cl www.marcomchile.cl localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de evidencias fotográficas y firmas digitales en Órdenes de Trabajo
    client_max_body_size 25M;

    # Compresión Gzip para optimizar carga de assets en producción
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Cabeceras de seguridad estándar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy inverso hacia el API Gateway (mismo dominio: https://marcomchile.cl/api/v1/...)
    location /api/ {
        proxy_pass http://gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Healthcheck del API Gateway
    location = /api-health {
        proxy_pass http://gateway:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Caché de largo plazo para assets estáticos compilados por Vite (con hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Soporte para retorno POST de pasarelas de pago (Flow) sobre rutas estáticas (convierte 405 POST -> 303 GET)
    error_page 405 =303 $request_uri;

    # Enrutamiento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
