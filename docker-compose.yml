version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marcom_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marcom_network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: marcom_auth_service
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyforauthservice_change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: marcom_inventory_service
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8002
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyforauthservice_change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  work-order-service:
    build:
      context: ./services/work-order-service
      dockerfile: Dockerfile
    container_name: marcom_work_order_service
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8003
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyforauthservice_change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: marcom_billing_service
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8004
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyforauthservice_change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8004:8004"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: marcom_api_gateway
    restart: always
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      WORK_ORDER_SERVICE_URL: http://work-order-service:8003
      BILLING_SERVICE_URL: http://billing-service:8004
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - inventory-service
      - work-order-service
      - billing-service
    networks:
      - marcom_network

networks:
  marcom_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
