services:
  db:
    image: postgres:15-alpine
    container_name: marcom_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marcom_network

  auth-service:
    image: marcom/auth-service:latest
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: marcom_auth_service
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-https://marcomchile.cl}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EXPOSE_RESET_TOKEN_IN_DEV: ${EXPOSE_RESET_TOKEN_IN_DEV:-false}
      SMTP_HOST: ${SMTP_HOST:-sunfire.mxrouting.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-contacto@marcomchile.cl}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-contacto@marcomchile.cl}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  inventory-service:
    image: marcom/inventory-service:latest
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: marcom_inventory_service
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8002
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  work-order-service:
    image: marcom/work-order-service:latest
    build:
      context: ./services/work-order-service
      dockerfile: Dockerfile
    container_name: marcom_work_order_service
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8003
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  billing-service:
    image: marcom/billing-service:latest
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: marcom_billing_service
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8004
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FRONTEND_URL: ${FRONTEND_URL:-https://marcomchile.cl}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://marcomchile.cl}
      FLOW_API_KEY: ${FLOW_API_KEY:-}
      FLOW_SECRET_KEY: ${FLOW_SECRET_KEY:-}
      FLOW_SANDBOX: ${FLOW_SANDBOX:-true}
      FLOW_URL: ${FLOW_URL:-https://sandbox.flow.cl/api}
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marcom_network

  gateway:
    image: marcom/gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: marcom_api_gateway
    restart: always
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      WORK_ORDER_SERVICE_URL: http://work-order-service:8003
      BILLING_SERVICE_URL: http://billing-service:8004
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://marcomchile.cl,https://www.marcomchile.cl,http://marcomchile.cl,http://www.marcomchile.cl,http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - auth-service
      - inventory-service
      - work-order-service
      - billing-service
    networks:
      - marcom_network

  frontend:
    image: marcom/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: marcom_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - gateway
    networks:
      - marcom_network

networks:
  marcom_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
